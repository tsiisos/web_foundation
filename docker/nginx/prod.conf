server_tokens off;
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # Docker's built-in DNS: re-resolve container names after restarts
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;
    set $frontend_upstream http://frontend:3000;

    # Django static files (collected into a shared volume)
    location /api/static/ {
        alias /srv/static/;
        expires 7d;
        access_log off;
    }

    # Public uploads, served straight from the media volume
    location /api/media/public/ {
        alias /srv/media/public/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; media-src 'self'; img-src 'self'; style-src 'unsafe-inline'" always;
        access_log off;
    }

    # Private uploads: reachable only through Django's permission check (X-Accel-Redirect)
    location /api/protected-media/ {
        internal;
        alias /srv/media/private/;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; media-src 'self'; img-src 'self'; style-src 'unsafe-inline'" always;
    }

    # Upload endpoint: the only place that accepts large bodies (videos up to 100 MB)
    location = /api/v1/media/ {
        client_max_body_size 110m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django REST Framework and admin
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js frontend
    location / {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
