name: web_foundation_prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_prod:/data
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      target: prod
    restart: unless-stopped
    env_file: ../.env.prod
    volumes:
      - static_prod:/app/staticfiles
      - media_prod:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build:
      context: ../backend
      target: prod
    restart: unless-stopped
    env_file: ../.env.prod
    command: celery -A config worker -B -s /tmp/celerybeat-schedule -l info --concurrency=1
    volumes:
      - media_prod:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Keeps a video job from starving the website on a small server, and lets a running job finish on deploy
    cpus: 0.5
    mem_limit: 512m
    stop_grace_period: 2m

  frontend:
    build:
      context: ../frontend
      target: prod
    restart: unless-stopped
    environment:
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - static_prod:/srv/static:ro
      - media_prod:/srv/media:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  pgdata_prod:
  static_prod:
  media_prod:
  redis_prod:
